name: linkedsafe

services:
  db:
    image: mysql:8.0
    container_name: linkedsafe-db
    restart: unless-stopped
    env_file:
      - ../.env.local
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3308:3306"
    volumes:
      - local_db_data:/var/lib/mysql
      - ../mysql-init/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: linkedsafe-redis
    restart: unless-stopped
    env_file:
      - ../.env.local
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass \"$REDIS_PASSWORD\""]
    volumes:
      - local_redis_data:/data

  wordpress:
    image: wordpress:6.8-php8.2-apache
    container_name: linkedsafe-wp
    restart: unless-stopped
    env_file:
      - ../.env.local
    depends_on:
      - db
      - redis
    volumes:
      - ../site:/var/www/html
      - ./php/custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro

  nginx:
    image: nginx:1.27-alpine
    container_name: linkedsafe-nginx
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/performance.conf:/etc/nginx/conf.d/00-performance.conf:ro
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ../ssl/local:/etc/nginx/ssl:ro

volumes:
  local_db_data:
  local_redis_data:
